<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victorian Lord Mayor Name Generator</title>
<style>
body{font-family:Georgia,serif;background:#f3ecdd;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;color:#2b2118}.generator{width:min(790px,calc(100% - 40px));background:#fff;padding:40px;border-radius:18px;text-align:center;box-shadow:0 12px 32px rgba(45,27,14,.18)}h1{color:#6f1016;margin-top:0}button{position:relative;min-height:52px;padding:13px 28px;margin:6px;border:2px solid #d9b553;border-radius:9px;color:#fff;font:700 1rem/1.2 Georgia,"Times New Roman",serif;letter-spacing:.025em;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.18),0 5px 10px rgba(45,27,14,.24);text-shadow:0 1px 1px rgba(0,0,0,.4);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}button::before{content:"✦";margin-right:.55em;color:#f6dc85;font-size:.88em}button:hover{transform:translateY(-2px);filter:brightness(1.08)}button:focus-visible{outline:3px solid #f6dc85;outline-offset:3px}.generate-button{background:linear-gradient(#8d1820,#6f1016)}.copy-button{background:linear-gradient(#245780,#173b61)}#result{font-size:2rem;margin:25px;padding:20px;border:1px solid #cfb77e;background:#fffaf0}#status{min-height:1.4em;color:#5c4937}
</style>
</head>
<body>
<main class="generator">
<h1>Victorian Lord Mayor Name Generator</h1>
<p>Generate a distinguished Victorian civic identity worthy of the Mayoralty and the Mansion House.</p>
<button class="generate-button" id="generateButton">Generate Lord Mayor</button>
<button class="copy-button" id="copyButton">Copy Name</button>
<div id="result" aria-live="polite">Sir Guildhall Mercer</div>
<p id="status" aria-live="polite"></p>
</main>
<script>
const starts=["Alder","Ale","Bar","Bas","Bon","Bot","Cole","Fen","Fleet","Gar","Lead","Loth","Mount","Or","Sher","Smith","Stain","Under","Wool","Chart","Charter","Bart","Bill","Billing","Crip","Cripple","Dow","Bay","Baynard"];
const middles=["en","ing","man","mary","lick","gar","con","haw","house","mew","ple"];
const endings=["bury","church","field","hall","hythe","noth","shaft","thaw","ward","well","worth"];
const preferredMiddles={Alder:["mary","man"],Ale:["con"],Bar:["ing"],Bas:["ing"],Bon:["thaw"],Bot:["olph"],Cole:["man"],Gar:["lick"],Lead:["en"],Mount:["haw"],Or:["gar"],Sher:["iff"],Stain:["ing"],Chart:["house"],Charter:["house"],Bart:["mew"],Bill:["ing"],Crip:["ple"],Bay:["nard"]};
const naturalEndings={Alder:["bury","hall","well","worth"],Ale:["bury","hall","well"],Bar:["bury","hall","well","worth"],Bas:["hall","bury","well"],Bon:["hall","well","worth"],Bot:["hall","bury","well"],Cole:["bury","hall","well"],Fen:["church","hall","well","worth"],Fleet:["hall","hythe","well","worth"],Gar:["bury","hall","hythe","well"],Lead:["bury","hall","well","worth"],Loth:["bury","hall","well","worth"],Mount:["hall","well","worth"],Or:["bury","hall","well","worth"],Sher:["bury","hall","well","worth"],Smith:["field","hall","well","worth"],Stain:["bury","hall","well","worth"],Under:["hall","shaft","well","worth"],Wool:["hall","noth","well","worth"],Chart:["hall","well","worth"],Charter:["hall","well","worth"],Bart:["hall","ward","well","worth"],Bill:["hall","bury","well","worth"],Billing:["hall","bury","well","worth"],Crip:["hall","bury","field"],Cripple:["hall","bury","field"],Dow:["hall","bury","well","worth"],Bay:["hall","bury","well","worth"],Baynard:["hall","bury","well","worth"]};
const originalCityWords=["Guildhall","Harc","Bassishaw","Wardmote","Langbourn","Walbrook","Candlewick","Epping","Hampstead","Coulsdon","Highgate","Chamberlain","Poultry","Eastcheap","Livery","Court","Farringdon","Portsoken","Cordwainer","Gresham","Westham","Kenley","Farthing downs","Ashtead","Queenhithe","Cornhill","Sheriff","Aleconner","Smithfield","Bridgemaster","Leadenhall","Garlickhythe","Barbican","Lothbury","Botolph","Woolnoth","Aldermary","Fenchurch","Orgar","Bonthaw","Mounthaw","Staining","Coleman","Undershaft","Fleet","Basinghall","Cryer","Sword","Mansion","Distaff","Monument","Threadneedle","Charterhouse","Bartholomew","Billings","Cripple","Dow","Baynard"];
const specialCities=["'Old' Bailey"];
const liveries=["Mercer","Grocer","Draper","Fishmonger","Goldsmith","Skinner","Merchant Taylor","Haberdasher","Salter","Ironmonger","Vintner","Clothworker","Dyer","Brewer","Leatherseller","Pewterer","Barber","Cutler","Baker","Wax Chandler","Tallow Chandler","Girdler","Butcher","Saddler","Carpenter","Cordwainer","Painter-Stainer","Currier","Mason","Plumber","Innholder","Founder","Poulterer","Cook","Cooper","Bowyer","Fletcher","Blacksmith","Joiner","Weaver","Woolman","Scrivener","Fruiterer","Plaisterer","Stationer","Broderer","Upholder","Musician","Turner","Basketmaker","Glazier","Horner","Farrier","Pavier","Loriner","Glover","Feltmaker","Gardener","Wheelwright","Distiller","Pattenmaker","Carmen","Farmer","Launderer","Marketer","Insurer","Lightmonger","Nurse"];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function cityCase(v){return v.charAt(0).toUpperCase()+v.slice(1).toLowerCase()}
function normalisePart(v){return v.toLowerCase()}
function hasRepeatedSyllable(parts,next){const n=normalisePart(next);return parts.some(p=>normalisePart(p)===n)||parts.some(p=>{const q=normalisePart(p);return q.endsWith(n)||n.endsWith(q)})}
function smartJoin(left,right){if(!right)return left;const l=left.toLowerCase(),r=right.toLowerCase();if(l.endsWith(r))return left;if(l.endsWith("mew")&&r==="worth")return left+"orth";const last=l.slice(-1),first=r.charAt(0),v="aeiou";if(last===first)return left+right.slice(1);if(last==="e"&&v.includes(first))return left.slice(0,-1)+right;if(v.includes(last)&&v.includes(first))return left+"n"+right;return left+right}
function weightedEnding(start,used){let pool=(naturalEndings[start]&&Math.random()<.72)?naturalEndings[start]:endings;pool=pool.filter(x=>!hasRepeatedSyllable(used,x));return pick(pool.length?pool:endings)}
function weightedMiddle(start,used){let pool=(preferredMiddles[start]&&Math.random()<.62)?preferredMiddles[start]:middles;pool=pool.filter(x=>!hasRepeatedSyllable(used,x));return pick(pool.length?pool:middles.filter(x=>!hasRepeatedSyllable(used,x)))}
function generatedCity(){const roll=Math.random();if(roll<.35)return pick(originalCityWords);if(roll<.37)return pick(specialCities);const start=pick(starts),parts=[start];if(roll<.75){const end=weightedEnding(start,parts);return cityCase(smartJoin(start,end))}const middle=weightedMiddle(start,parts);parts.push(middle);const end=weightedEnding(start,parts);return cityCase(smartJoin(smartJoin(start,middle),end))}
function generateFullName(){result.textContent=`Sir ${generatedCity()} ${pick(liveries)}`;status.textContent="A new civic identity has been proclaimed."}
function copyFallback(text){const t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.position="fixed";t.style.left="-9999px";document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch{}document.body.removeChild(t);status.textContent=ok?"Name copied to clipboard.":"Select the name and copy it manually."}
generateButton.addEventListener("click",generateFullName);copyButton.addEventListener("click",()=>{const text=result.textContent;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>status.textContent="Name copied to clipboard.").catch(()=>copyFallback(text))}else copyFallback(text)});generateFullName();
</script>
</body>
</html>
